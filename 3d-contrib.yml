name: GitHub-3D-Contrib

on:
  schedule:
    - cron: '0 18 * * *'  # Runs daily at midnight IST
  workflow_dispatch:       # Allows manual trigger
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    steps:
      - uses: actions/checkout@v3

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: RitanshuPatelMMR
          SETTING_JSON: |
            {
              "githubUserName": "RitanshuPatelMMR",
              "contributionColorArray": ["#0a0a0f", "#2d1b69", "#4c1d95", "#7C3AED", "#a78bfa"],
              "backgroundColor": "#0a0a0f",
              "angle": -30,
              "type": "normal"
            }

      - name: Commit 3D graph
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Update 3D contribution graph"
          git push
